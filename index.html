<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Тест на реакцию — Three.js</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #222; }
    #results {
      position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px;
      background: rgba(0,0,0,0.7); padding: 10px; border-radius: 7px; z-index: 10; display:none;
    }
    #timer {
      position: absolute; top: 10px; right: 10px; color: #fff; font-size: 32px;
      background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 7px; z-index: 10;
      font-weight: bold; font-family: monospace;
    }
  </style>
</head>
<body>
<div id="results"></div>
<div id="timer">20</div>
<audio id="failSound" src="sounds/fail-sound.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
